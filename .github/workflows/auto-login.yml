name: Auto Login Vortexa

on:
  schedule:
    # 每天 UTC 时间 06:30 运行（对应北京时间下午 02:30）
    - cron: '30 6 * * *'

  workflow_dispatch: # 允许手动触发

jobs:
  web-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      # 有头模式 + 虚拟显示：比纯无头更像真实浏览器，过 Vercel 检查的概率更高
      - name: Execute Login Script
        env:
          VORTEXA_USER: ${{ secrets.VORTEXA_USER }}
          VORTEXA_PASS: ${{ secrets.VORTEXA_PASS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          VORTEXA_HEADED: '1'
        run: |
          xvfb-run -a --server-args="-screen 0 1280x720x24" python login.py

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortexa-screenshots
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 7
